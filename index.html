<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Motherlode CS:GO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Tailwind CSS v4 CDN -->
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  <style>
    body { font-family: 'Space Grotesk', system-ui, sans-serif; }
  </style>
</head>
<body class="bg-black text-white min-h-screen antialiased selection:bg-white selection:text-black">
  <div class="max-w-[680px] mx-auto px-4 pb-14">
    
    <!-- Top App Bar -->
    <header class="sticky top-0 z-30 flex items-center justify-between w-full bg-black py-3 border-b border-white/10">
      <!-- Menu Button -->
      <button type="button" id="menu-btn" aria-haspopup="true" aria-expanded="false" aria-controls="menu" class="relative flex items-center justify-center p-2.5 rounded-full text-white hover:bg-white/5 active:scale-95 transition">
        <svg viewBox="0 0 24 24" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M4 7h16M4 12h16M4 17h10"></path>
        </svg>
        <span id="menu-dot" class="hidden absolute top-1.5 right-1.5 w-2 h-2 rounded-full bg-white ring-2 ring-black"></span>
      </button>

      <!-- Center Title -->
      <div id="menu-label" class="absolute left-1/2 -translate-x-1/2 font-semibold text-lg sm:text-xl truncate max-w-[60%] pointer-events-none">
        Profile
      </div>

      <!-- Right Logo Button -->
      <div class="flex items-center h-8">
        <button type="button" data-h="profile" data-label="Profile" class="h-full bg-transparent border-0 cursor-pointer">
          <img id="bar-logo" src="assets/motherlode_official_logo.png" alt="Motherlode" class="h-full w-auto object-contain">
        </button>
      </div>

      <!-- Scrim Overlay -->
      <div id="menu-scrim" class="hidden fixed inset-0 bg-black/65 z-40"></div>

      <!-- Dropdown Drawer -->
      <nav id="menu" class="hidden absolute z-50 top-[calc(100%+8px)] left-3 w-[min(320px,calc(100vw-24px))] max-h-[calc(100dvh-80px)] overflow-y-auto bg-[#0a0a0a] border border-white/15 rounded-3xl p-2 shadow-2xl shadow-black">
        <div class="px-3.5 py-3">
          <small class="block text-xs text-white/60">Signed in as</small>
          <span id="home-user" class="block text-lg font-bold truncate">Player</span>
        </div>

        <div role="tablist" class="flex flex-col gap-1">
          <!-- Profile -->
          <button class="mi flex items-center gap-3.5 w-full min-h-[48px] px-3.5 rounded-2xl text-left text-[15px] font-medium text-white/70 hover:bg-white/10 hover:text-white transition cursor-pointer" role="tab" type="button" data-h="profile" data-label="Profile" aria-selected="true">
            <svg viewBox="0 0 24 24" class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>
            </svg>
            <span>Profile</span>
          </button>

          <!-- Events (Holds Brackets & Games) -->
          <button class="mi flex items-center gap-3.5 w-full min-h-[48px] px-3.5 rounded-2xl text-left text-[15px] font-medium text-white/70 hover:bg-white/10 hover:text-white transition cursor-pointer" role="tab" type="button" data-h="events" data-label="Events" aria-selected="false">
            <svg viewBox="0 0 24 24" class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
              <line x1="16" y1="2" x2="16" y2="6"/>
              <line x1="8" y1="2" x2="8" y2="6"/>
              <line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
            <span>Events</span>
          </button>

          <!-- Stats -->
          <button class="mi flex items-center gap-3.5 w-full min-h-[48px] px-3.5 rounded-2xl text-left text-[15px] font-medium text-white/70 hover:bg-white/10 hover:text-white transition cursor-pointer" role="tab" type="button" data-h="stats" data-label="Stats" aria-selected="false">
            <svg viewBox="0 0 24 24" class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 20V11M12 20V4M19 20v-6"/>
            </svg>
            <span>Stats</span>
          </button>

          <!-- Players -->
          <button class="mi flex items-center gap-3.5 w-full min-h-[48px] px-3.5 rounded-2xl text-left text-[15px] font-medium text-white/70 hover:bg-white/10 hover:text-white transition cursor-pointer" role="tab" type="button" data-h="players" data-label="Players" aria-selected="false">
            <svg viewBox="0 0 24 24" class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.4c2.3.7 3.5 2.6 3.5 5.6"/>
            </svg>
            <span>Players</span>
          </button>

          <!-- Store -->
          <button class="mi flex items-center gap-3.5 w-full min-h-[48px] px-3.5 rounded-2xl text-left text-[15px] font-medium text-white/70 hover:bg-white/10 hover:text-white transition cursor-pointer" role="tab" type="button" data-h="store" data-label="Store" aria-selected="false">
            <svg viewBox="0 0 24 24" class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 8h14l-1 12H6z"/><path d="M9 8a3 3 0 0 1 6 0"/>
            </svg>
            <span>Store</span>
          </button>

          <!-- Admin Panel (dev only) -->
          <button id="mi-admin" class="mi hidden flex items-center gap-3.5 w-full min-h-[48px] px-3.5 rounded-2xl text-left text-[15px] font-medium text-white/70 hover:bg-white/10 hover:text-white transition cursor-pointer" role="tab" type="button" data-h="admin" data-label="Admin panel" aria-selected="false">
            <svg viewBox="0 0 24 24" class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3l8 3v6c0 4.5-3.3 8-8 9-4.7-1-8-4.5-8-9V6z"/><path d="M9.5 12l2 2 3.5-4"/>
            </svg>
            <span>Admin panel</span>
          </button>

          <!-- Host Panel (host only) -->
          <button id="mi-host" class="mi hidden flex items-center gap-3.5 w-full min-h-[48px] px-3.5 rounded-2xl text-left text-[15px] font-medium text-white/70 hover:bg-white/10 hover:text-white transition cursor-pointer" role="tab" type="button" data-h="host" data-label="Host panel" aria-selected="false">
            <svg viewBox="0 0 24 24" class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 21V4M5 4h11l-2 4 2 4H5"/>
            </svg>
            <span>Host panel</span>
          </button>
        </div>

        <div class="h-px bg-white/10 my-1.5 mx-2"></div>

        <!-- Log out -->
        <button id="logout" type="button" class="flex items-center gap-3.5 w-full min-h-[48px] px-3.5 rounded-2xl text-left text-[15px] font-medium text-white/70 hover:bg-white/10 hover:text-white transition cursor-pointer">
          <svg viewBox="0 0 24 24" class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>
          </svg>
          <span>Log out</span>
        </button>
      </nav>
    </header>

    <!-- Main Panes Container -->
    <main class="mt-6">
      <!-- Profile Pane -->
      <section id="p-profile" class="pane block">
        <h1 class="text-2xl font-bold">Profile</h1>
      </section>

      <!-- Events Pane with Subtabs -->
      <section id="p-events" class="pane hidden">
        <h1 class="text-2xl font-bold mb-4">Events</h1>

        <!-- Subtabs Segmented Bar -->
        <div class="grid grid-cols-2 bg-black border border-white/15 rounded-full p-1 mb-6">
          <button id="subtab-bracket" type="button" class="event-subtab py-2 text-sm font-semibold tracking-wider uppercase rounded-full bg-white text-black transition cursor-pointer">
            Bracket
          </button>
          <button id="subtab-games" type="button" class="event-subtab py-2 text-sm font-semibold tracking-wider uppercase rounded-full text-white/60 hover:text-white transition cursor-pointer">
            Games
          </button>
        </div>

        <!-- Subtab View: Bracket -->
        <div id="subpane-bracket" class="event-subpane block p-6 border border-white/10 rounded-2xl bg-white/5 text-center">
          <h2 class="text-lg font-semibold text-white/90">Bracket</h2>
        </div>

        <!-- Subtab View: Games -->
        <div id="subpane-games" class="event-subpane hidden p-6 border border-white/10 rounded-2xl bg-white/5 text-center">
          <h2 class="text-lg font-semibold text-white/90">Games & Signups</h2>
        </div>
      </section>

      <!-- Stats Pane -->
      <section id="p-stats" class="pane hidden">
        <h1 class="text-2xl font-bold">Stats</h1>
      </section>

      <!-- Players Pane -->
      <section id="p-players" class="pane hidden">
        <h1 class="text-2xl font-bold">Players</h1>
      </section>

      <!-- Store Pane -->
      <section id="p-store" class="pane hidden">
        <h1 class="text-2xl font-bold">Store</h1>
      </section>

      <!-- Admin Panel Pane -->
      <section id="p-admin" class="pane hidden">
        <h1 class="text-2xl font-bold">Admin Panel</h1>
      </section>

      <!-- Host Panel Pane -->
      <section id="p-host" class="pane hidden">
        <h1 class="text-2xl font-bold">Host Panel</h1>
      </section>
    </main>

  </div>
